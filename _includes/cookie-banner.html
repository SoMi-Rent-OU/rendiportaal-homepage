<div id="cookie-banner" class="hidden fixed bottom-0 inset-x-0 z-50 bg-white border-t border-gray-200 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-4 sm:flex sm:items-center sm:justify-between sm:gap-4">
    <p class="text-sm">
      {{ t.cookie_text }}
      <a href="{{ lang_prefix }}/kupsised/" class="font-bold underline">{{ t.cookie_learn_more }}</a>
    </p>
    <div class="mt-3 sm:mt-0 flex gap-2 shrink-0">
      <button id="cookie-decline" class="px-4 py-2 text-sm font-bold border border-gray-300 rounded-lg hover:bg-gray-100">
        {{ t.cookie_decline }}
      </button>
      <button id="cookie-accept" class="px-4 py-2 text-sm font-bold bg-red-700 text-white rounded-lg hover:bg-red-700">
        {{ t.cookie_accept }}
      </button>
    </div>
  </div>
</div>
