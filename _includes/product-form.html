<section class="max-w-7xl mx-auto px-4 py-10">
  <div class="max-w-xl">
    <h2 class="text-2xl font-bold mb-2">Päring</h2>
    <p class="mb-6">Jäta oma päring ja vastame esimesel võimalusel.</p>

    <form action="https://formsubmit.co/rihard@pikker.dev" method="POST" class="space-y-4">
      <input type="hidden" name="_subject" value="Uus päring: {{ page.title }}">
      <input type="hidden" name="_captcha" value="true">

      <div>
        <label for="email" class="block font-bold mb-1">E-post</label>
        <input type="email" id="email" name="email" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600">
      </div>

      <div>
        <label for="message" class="block font-bold mb-1">Lisainfo</label>
        <textarea id="message" name="message" rows="4"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
      </div>

      <button type="submit"
        class="bg-green-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-green-700 transition">
        Saada päring
      </button>
    </form>
  </div>
</section>
