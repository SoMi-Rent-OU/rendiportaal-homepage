<a href="{{ include.href }}" class="group bg-black relative block overflow-hidden md:rounded-lg aspect-[4/5]">
  <img loading="lazy" src="{{ include.image }}" alt="{{ include.alt }}" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-70 group-hover:scale-105 transition-all duration-700">
  <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>
  <div class="relative z-10 flex flex-col justify-end h-full p-8 md:p-10">
    <h2 class="text-4xl md:text-5xl font-black text-white uppercase leading-none mb-4">{{ include.title }}</h2>
    <p class="text-gray-200 mb-6 max-w-sm">{{ include.description }}</p>
    <span class="inline-flex items-center gap-2 self-start bg-red-700 text-white text-sm font-bold tracking-wider uppercase px-6 py-3 rounded-lg group-hover:bg-red-800 group-hover:gap-3 transition-all">Vaata lähemalt <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg></span>
  </div>
</a>
