---
layout: default
---

{% assign product_id = page.slug %}

<nav class="max-w-7xl mx-auto px-4 pt-8 text-sm">
  <a href="/" class="hover:text-green-600 transition">Avaleht</a>
  <span class="mx-2">/</span>
  <a href="{{ page.category_url }}" class="hover:text-green-600 transition">{{ page.category_title }}</a>
  <span class="mx-2">/</span>
  <span class="font-bold">{{ page.title }}</span>
</nav>

<section class="max-w-7xl mx-auto px-4 py-10">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
    <div class="aspect-[4/3] bg-gray-100 rounded-xl overflow-hidden">
      <img src="/images/products/{{ product_id }}.jpg" alt="{{ page.title }}" class="w-full h-full object-cover">
    </div>

    <div class="space-y-4 md-content">
      {{ content }}
    </div>
  </div>
</section>

{% include product-form.html %}
