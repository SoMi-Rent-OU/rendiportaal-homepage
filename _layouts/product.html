---
layout: default
---

{% assign category_url = page.category_permalink %}

<nav class="max-w-7xl mx-auto px-4 pt-8 text-sm">
  <a href="/" class="hover:text-green-600 transition">Avaleht</a>
  <span class="mx-2">/</span>
  <a href="{{ category_url }}" class="hover:text-green-600 transition">{{ page.category }}</a>
  <span class="mx-2">/</span>
  <span class="font-bold">{{ page.title }}</span>
</nav>

<section class="max-w-7xl mx-auto px-4 py-10">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
    <div class="aspect-[4/3] bg-gray-100 rounded-xl overflow-hidden">
      <img src="/images/products/{{ page.product_id }}.jpg" alt="{{ page.title }}" class="w-full h-full object-cover">
    </div>

    <div>
      <h1 class="text-3xl md:text-4xl font-extrabold mb-4">{{ page.title }}</h1>
      <p class="mb-8 leading-relaxed">{{ page.description }}</p>

      {% if page.specs %}
        <h2 class="text-xl font-bold mb-4">Tehnilised andmed</h2>
        <ul class="space-y-2">
          {% for spec in page.specs %}
            <li class="flex items-start gap-2">
              <span class="mt-1 w-2 h-2 rounded-full bg-green-500 flex-shrink-0"></span>
              <span>{{ spec }}</span>
            </li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  </div>
</section>
