<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .md-content h1 { font-size: 1.875rem; font-weight: 800; line-height: 1.2; margin-bottom: 1rem; }
    .md-content h2 { font-size: 1.125rem; font-weight: 700; margin-top: 2rem; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e5e7eb; }
    .md-content p { line-height: 1.7; margin-bottom: 0.75rem; }
    .md-content ul { list-style-type: none; padding-left: 1.5rem; margin-bottom: 1rem; }
    .md-content ol { list-style-type: none; padding-left: 1.5rem; margin-bottom: 1rem; counter-reset: md-counter; }
    .md-content li { line-height: 1.7; margin-bottom: 0.35rem; position: relative; }
    .md-content ul li::before { content: "●"; color: #16a34a; position: absolute; left: -1.25rem; font-size: 0.6rem; top: 0.5rem; }
    .md-content ol li::before { counter-increment: md-counter; content: counter(md-counter) "."; color: #16a34a; font-weight: 600; position: absolute; left: -1.5rem; }
    .md-content a { color: #16a34a; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .md-content a:hover { color: #15803d; }
  </style>
</head>
<body class="bg-gray-50">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
