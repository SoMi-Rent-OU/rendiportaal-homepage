{% include lang.html %}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ t.meta_title_suffix }}</title>
  <meta name="description" content="{{ page.description | default: t.meta_default_description }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:image" content="{{ site.url }}{{ page.images[0] | default: page.image | default: '/images/og-img.jpeg' }}">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tailwind.min.css">
  {% if page.lang_pair %}
    <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ page.url }}">
    <link rel="alternate" hreflang="{{ other_lang }}" href="{{ site.url }}{{ page.lang_pair }}">
  {% endif %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "url": "{{ site.url }}"
    {% if site.email %}
    ,"email": "{{ site.email }}"
    {% endif %}
    {% if site.phone %}
    ,"telephone": "{{ site.phone }}"
    {% endif %}
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": {{ site.title | jsonify }},
    "url": "{{ site.url }}"
    {% if site.email %}
    ,"email": "{{ site.email }}"
    {% endif %}
    {% if site.phone %}
    ,"telephone": "{{ site.phone }}"
    {% endif %}
    ,"address": [
      {% for location in site.locations %}
      {
        "@type": "PostalAddress",
        "name": {{ location[0] | jsonify }},
        "addressLocality": {{ location[1] | jsonify }},
        "addressCountry": "EE"
      }{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    ]
  }
  </script>
</head>
<body class="font-sans text-gray-900 bg-white">
  {% include navbar.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
