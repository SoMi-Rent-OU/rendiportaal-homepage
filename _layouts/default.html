{% include lang.html %}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'analytics_storage': 'denied'
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ t.meta_title_suffix }}</title>
  <meta name="description" content="{{ page.description | default: t.meta_default_description }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:image" content="{{ site.url }}{{ page.images[0] | default: page.image | default: '/images/og-img.jpeg' }}">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tailwind.min.css">
  {% if page.lang_pair %}
    <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ page.url }}">
    <link rel="alternate" hreflang="{{ other_lang }}" href="{{ site.url }}{{ page.lang_pair }}">
  {% endif %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "url": "{{ site.url }}"
    {% if site.email %}
    ,"email": "{{ site.email }}"
    {% endif %}
    {% if site.phone %}
    ,"telephone": "{{ site.phone }}"
    {% endif %}
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": {{ site.title | jsonify }},
    "url": "{{ site.url }}"
    {% if site.email %}
    ,"email": "{{ site.email }}"
    {% endif %}
    {% if site.phone %}
    ,"telephone": "{{ site.phone }}"
    {% endif %}
    ,"address": [
      {% for location in site.locations %}
      {
        "@type": "PostalAddress",
        "name": {{ location[0] | jsonify }},
        "addressLocality": {{ location[1] | jsonify }},
        "addressCountry": "EE"
      }{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    ]
  }
  </script>
</head>
<body class="font-sans text-gray-900 bg-white">
  {% include navbar.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  {% include cookie-banner.html %}
  <script>
    (function() {
      var GA_ID = 'G-BMLLKTXXZ8';
      var consent = localStorage.getItem('cookie_consent');
      var banner = document.getElementById('cookie-banner');

      function loadGA() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
        gtag('js', new Date());
        gtag('config', GA_ID);
      }

      function showBanner() {
        banner.classList.remove('hidden');
      }

      if (consent === 'accepted') {
        loadGA();
      } else if (!consent) {
        showBanner();
      }

      document.getElementById('cookie-accept').addEventListener('click', function() {
        localStorage.setItem('cookie_consent', 'accepted');
        banner.classList.add('hidden');
        loadGA();
      });

      document.getElementById('cookie-decline').addEventListener('click', function() {
        localStorage.setItem('cookie_consent', 'declined');
        banner.classList.add('hidden');
      });

      var settingsLink = document.getElementById('cookie-settings-link');
      if (settingsLink) {
        settingsLink.addEventListener('click', function(e) {
          e.preventDefault();
          showBanner();
        });
      }
    })();
  </script>
</body>
</html>
