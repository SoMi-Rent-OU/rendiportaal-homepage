<section class="py-16 px-4">

      <h1 class="text-4xl md:text-5xl font-bold mb-4">{{ page.title }}</h1>
      <p class="text-lg mb-6">{{ page.description }}</p>
      <a href="/paring/" class="inline-block bg-red-700 text-white font-bold px-6 py-3 rounded-lg hover:bg-red-800 transition">

      <img src="/images/hero.avif" alt="SoMi-Rent" class="rounded-xl w-full">
