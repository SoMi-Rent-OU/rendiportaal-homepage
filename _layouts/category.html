---
layout: default
---

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Avaleht",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title }}",
      "item": "{{ site.url }}{{ page.url }}"
    }
  ]
}
</script>

<nav class="max-w-7xl mx-auto px-4 pt-8 text-sm">
  <a href="/" class="hover:text-red-700 transition">Avaleht</a>
  <span class="mx-2">/</span>
  <span class="font-bold">{{ page.title }}</span>
</nav>

<section class="max-w-7xl mx-auto px-4 py-10">
  <h1 class="text-3xl md:text-4xl font-extrabold mb-2">{{ page.title }}</h1>
  {% if page.description %}
    <p class="mb-10 max-w-2xl">{{ page.description }}</p>
  {% endif %}

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for product in site.products %}
      {% if product.category == page.slug %}
        <a href="{{ product.url }}" class="group block bg-white rounded-xl overflow-hidden border border-gray-200 hover:border-red-700/40 transition shadow-lg hover:shadow-red-700/10">
          <div class="aspect-[4/3] bg-gray-100 overflow-hidden">
            <img src="/images/products/{{ product.slug }}.jpg" alt="{{ product.title }}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          </div>
          <div class="p-5">
            <h3 class="text-lg font-bold mb-1 group-hover:text-red-700 transition">{{ product.title }}</h3>
            <span class="inline-block mt-3 text-sm font-semibold text-red-700 group-hover:translate-x-1 transition-transform">
              VAATA LÄHEMALT &rarr;
            </span>
          </div>
        </a>
      {% endif %}
    {% endfor %}
  </div>
</section>
