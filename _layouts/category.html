---
layout: default
---

<nav class="max-w-7xl mx-auto px-4 pt-8 text-sm text-gray-500">
  <a href="/" class="hover:text-green-600 transition">Avaleht</a>
  <span class="mx-2">/</span>
  <span class="text-gray-900 font-medium">{{ page.title }}</span>
</nav>

<section class="max-w-7xl mx-auto px-4 py-10">
  <h1 class="text-3xl md:text-4xl font-extrabold mb-2">{{ page.title }}</h1>
  {% if page.description %}
    <p class="text-gray-600 mb-10 max-w-2xl">{{ page.description }}</p>
  {% endif %}

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for product in site.products %}
      {% if product.category == page.title %}
        <a href="{{ product.url }}" class="group block bg-white rounded-xl overflow-hidden border border-gray-200 hover:border-green-500/40 transition shadow-lg hover:shadow-green-500/10">
          <div class="aspect-[4/3] bg-gray-100 overflow-hidden">
            <img src="/images/products/{{ product.product_id }}.jpg" alt="{{ product.title }}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          </div>
          <div class="p-5">
            <h3 class="text-lg font-bold mb-1 group-hover:text-green-600 transition">{{ product.title }}</h3>
            <p class="text-sm text-gray-600">{{ product.description }}</p>
            <span class="inline-block mt-3 text-sm font-semibold text-green-600 group-hover:translate-x-1 transition-transform">
              VAATA LÄHEMALT &rarr;
            </span>
          </div>
        </a>
      {% endif %}
    {% endfor %}
  </div>
</section>
