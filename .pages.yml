media: images

content:
  - name: config
    label: Saidi seaded
    type: file
    path: _config.yml
    fields:
      - name: title
        type: string
        label: Saidi nimi
      - name: description
        type: text
        label: Kirjeldus
      - name: email
        type: string
        label: E-post
      - name: phone
        type: string
        label: Telefon
      - name: locations
        type: object
        label: Asukohad
        fields:
          - name: tehnika
            type: string
            label: Tehnika
          - name: tellingud
            type: string
            label: Tellingud ja piirdeaiad
      - name: navigation
        type: object
        list: true
        label: Navigatsioon
        fields:
          - name: title
            type: string
            label: Pealkiri
          - name: url
            type: string
            label: Link
          - name: children
            type: object
            list: true
            label: Alamlingid
            fields:
              - name: title
                type: string
                label: Pealkiri
              - name: url
                type: string
                label: Link
      - name: footer_links
        type: object
        list: true
        label: Jaluse lingid
        fields:
          - name: title
            type: string
            label: Pealkiri
          - name: url
            type: string
            label: Link

  - name: home
    label: Avaleht
    type: file
    path: index.md
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Meta kirjeldus

  - name: lehed
    label: Lehed
    type: collection
    path: _pages
    filename: "{primary}.md"
    exclude: ["products/*"]
    view:
      primary: title
    fields:
      - name: layout
        type: string
        hidden: true
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: image
        type: image
        label: Pilt
      - name: children
        type: string
        list: true
        label: Alamlehed
      - name: permalink
        type: string
        label: Püsiviide
      - name: body
        type: rich-text
        label: Sisu

  - name: tooted
    label: Tooted
    type: collection
    path: _pages/products
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: image
        type: image
        label: Pilt
      - name: images
        type: image
        list: true
        label: Pildid (karussell)
      - name: permalink
        type: string
        label: Püsiviide
      - name: additionalEquipment
        type: string
        list: true
        label: Lisaseadmed
      - name: specifications
        type: object
        list: true
        label: Tehnilised andmed
        fields:
          - name: label
            type: string
            label: Parameeter
          - name: value
            type: string
            label: Näitaja
      - name: youtubeVideos
        type: string
        list: true
        label: YouTube videod
      - name: body
        type: rich-text
        label: Sisu
