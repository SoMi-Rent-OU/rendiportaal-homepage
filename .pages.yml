  - name: home_et
    label: Avaleht (ET)
    type: file
    path: _pages/et/index.md
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Meta kirjeldus

  - name: home_ru
    label: Avaleht (RU)
    type: file
    path: _pages/ru/index.md
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Meta kirjeldus

  - name: et_lehed
    label: Lehed (ET)
    type: collection
    path: _pages/et
    filename: "{primary}.md"
    exclude: ["products/*", "overview/*"]
    view:
      primary: title
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: permalink
        type: string
        label: Püsiviide
      - name: body
        type: rich-text
        label: Sisu

  - name: ru_lehed
    label: Lehed (RU)
    type: collection
    path: _pages/ru
    filename: "{primary}.md"
    exclude: ["products/*", "overview/*"]
    view:
      primary: title
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: permalink
        type: string
        label: Püsiviide
      - name: body
        type: rich-text
        label: Sisu

  - name: et_ylevaated
    label: Ülevaated (ET)
    type: collection
    path: _pages/et/overview
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: children
        type: string
        list: true
        label: Alamlehed
      - name: permalink
        type: string
        label: Püsiviide
      - name: body
        type: rich-text
        label: Sisu

  - name: ru_ylevaated
