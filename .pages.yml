        type: text
        label: Kirjeldus
      - name: children
        type: string
        list: true
        label: Alamlehed
      - name: permalink
        type: string
        label: Püsiviide
      - name: body
        type: rich-text
        label: Sisu

  - name: et_tooted
    label: Tooted (ET)
    type: collection
    path: _pages/et/products
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: images
        type: image
        list: true
        label: Pildid
      - name: permalink
        type: string
        label: Püsiviide
      - name: additionalEquipment
        type: string
        list: true
        label: Lisaseadmed
      - name: specifications
        type: object
        list: true
        label: Tehnilised andmed
        fields:
          - name: label
            type: string
            label: Parameeter
          - name: value
            type: string
            label: Näitaja
      - name: youtubeVideos
        type: string
        list: true
        label: YouTube videod
      - name: body
        type: rich-text
        label: Sisu

  - name: ru_tooted
