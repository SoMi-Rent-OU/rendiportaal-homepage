media: images

content:
  - name: config
    label: Saidi seaded
    type: file
    path: _config.yml
    fields:
      - name: title
        type: string
        label: Saidi nimi
      - name: description
        type: text
        label: Kirjeldus
      - name: email
        type: string
        label: E-post
      - name: phone
        type: string
        label: Telefon

  - name: home
    label: Avaleht
    type: file
    path: index.markdown
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Meta kirjeldus

  - name: products
    label: Tooted
    type: collection
    path: _products
    subfolders: true
    view:
      primary: title
    fields:
      - name: layout
        type: select
        label: Tüüp
        options:
          - category
          - product
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: category_title
        type: string
        label: Kategooria nimi
      - name: category_url
        type: string
        label: Kategooria URL
      - name: permalink
        type: string
        label: Püsiviide
      - name: hidden
        type: boolean
        label: Peidetud
      - name: body
        type: rich-text
        label: Sisu
