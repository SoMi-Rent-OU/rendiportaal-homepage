media: images

content:
  - name: config
    label: Saidi seaded
    type: file
    path: _config.yml
    fields:
      - name: title
        type: string
        label: Saidi nimi
      - name: description
        type: text
        label: Kirjeldus
      - name: email
        type: string
        label: E-post
      - name: phone
        type: string
        label: Telefon

  - name: home
    label: Avaleht
    type: file
    path: index.markdown
    fields:
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Meta kirjeldus

  - name: kategooriad
    label: Kategooriad
    type: collection
    path: _categories
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: layout
        type: string
        default: category
        hidden: true
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: permalink
        type: string
        label: Püsiviide
      - name: hidden
        type: boolean
        label: Peidetud
      - name: image
        type: image
        label: Pilt

  - name: tooted
    label: Tooted
    type: collection
    path: _products
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: layout
        type: string
        default: product
        hidden: true
      - name: title
        type: string
        label: Pealkiri
      - name: description
        type: text
        label: Kirjeldus
      - name: category
        type: string
        label: Kategooria
      - name: image
        type: image
        label: Pilt
      - name: body
        type: rich-text
        label: Sisu
